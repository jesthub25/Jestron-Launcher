name: Derle ve test et

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod:
    name: Jestron Client (derleme + gerçek oyun testi)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: jestron-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Derle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Grafik sürücüsü (xvfb + Mesa)
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils >/dev/null

      - name: Efekt Menüsü'nü test için indir
        if: ${{ vars.TEST_WITH_EFEKT != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p run/mods
          url=$(gh api repos/jesthub25/JestronPriv/releases --jq '[.[] | select(.tag_name|startswith("mod-1.21.4-v"))][0].assets[] | select(.name|test("-mc1\\.21\\.4\\.jar$")) | .browser_download_url' | head -1)
          if [ -n "$url" ]; then curl -sSL -o run/mods/efekt-menusu.jar "$url" && ls -la run/mods; else echo "Efekt Menüsü bulunamadı, onsuz test edilecek"; fi

      - name: Gerçek oyun içinde test
        env:
          JESTRON_SELFTEST: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon || true
          echo "--- sonuç ---"
          cat run/jestron-selftest.txt || echo "sonuç dosyası yok"
          grep -q '^OK' run/jestron-selftest.txt

      - name: Test çıktıları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oyun-ici-test
          path: |
            jestron-client/run/screenshots/
            jestron-client/run/logs/latest.log
            jestron-client/run/jestron-selftest.txt
            jestron-client/run/crash-reports/
          if-no-files-found: ignore

      - name: Mod jar
        uses: actions/upload-artifact@v4
        with:
          name: jestron-client
          path: jestron-client/build/libs/*.jar
